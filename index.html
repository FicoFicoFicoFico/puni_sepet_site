
<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">

    <title>Puni Sepet</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
            rel="stylesheet"
    >

</head>

<body>

<div class="site">

    <!-- Background slideshow -->
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>


    <!-- Background overlays -->
    <div class="overlay"></div>
    <div class="contact-backdrop"></div>


    <!-- Homepage -->
    <main>

        <section class="home-content">

            <!-- Main logo -->
            <div class="hero-logo">
                <img
                        src="images/logo_white.png"
                        alt="Punišepet"
                >
            </div>

            <!-- Subtitle -->
            <p class="subtitle">
                Strast prema vinu. Predanost kvaliteti.
            </p>

            <!-- Contact button -->
            <button
                    class="nav-link hero-contact"
                    id="contactButton"
                    type="button"
                    aria-controls="contactPopup"
                    aria-expanded="false"
            >
                Kontakt
            </button>

        </section>

    </main>


    <!-- Contact popup -->
    <section
            class="contact-content"
            id="contactPopup"
            role="dialog"
            aria-modal="true"
            aria-labelledby="contactTitle"
            aria-hidden="true"
            tabindex="-1"
            inert
    >

        <!-- Close button -->
        <button
                class="contact-close"
                id="contactClose"
                type="button"
                aria-label="Zatvori kontakt"
        >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <h1 id="contactTitle">Kontakt info</h1>

        <!-- Contact information -->
        <div class="contact-details">

            <p>
                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    office@punisepet.hr
            </p>

            <p>
                <i class="fa-solid fa-phone-flip" aria-hidden="true"></i>
                    +385 91 7615 725
            </p>

            <p>
                <i class="fa-solid fa-phone" aria-hidden="true"></i>
                    +385 97 7379 260
            </p>

            <p>
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                Zagreb, Hrvatska
            </p>

        </div>

    </section>


    <!-- Slideshow navigation -->
    <div
            class="slideshow-controls"
            role="group"
            aria-label="Navigacija kroz fotografije"
    ></div>

</div>


<script>

    // Slideshow settings

    const slides = document.querySelectorAll(".slide");
    const controls = document.querySelector(".slideshow-controls");

    const slideInterval = 5500;

    let currentSlide = 0;
    let slideshowTimer = null;


    // Generate navigation dots automatically

    slides.forEach((slide, index) => {

        const dot = document.createElement("button");

        dot.className = "slide-dot";
        dot.type = "button";

        dot.setAttribute(
            "aria-label",
            `Prikaži fotografiju ${index + 1}`
        );

        if (index === 0) {
            dot.classList.add("active");
            dot.setAttribute("aria-current", "true");
        }

        dot.addEventListener("click", () => {

            showSlide(index);
            startSlideshow();

        });

        controls.appendChild(dot);

    });

    const dots = controls.querySelectorAll(".slide-dot");


    // Change slide

    function showSlide(index) {

        if (index < 0 || index >= slides.length) {
            return;
        }

        slides[currentSlide].classList.remove("active");
        dots[currentSlide].classList.remove("active");
        dots[currentSlide].removeAttribute("aria-current");

        currentSlide = index;

        slides[currentSlide].classList.add("active");
        dots[currentSlide].classList.add("active");
        dots[currentSlide].setAttribute("aria-current", "true");

    }


    // Next slide

    function nextSlide() {

        if (slides.length === 0) {
            return;
        }

        const next = (currentSlide + 1) % slides.length;

        showSlide(next);

    }


    // Start automatic slideshow

    function startSlideshow() {

        clearInterval(slideshowTimer);

        if (slides.length > 1) {

            slideshowTimer = setInterval(
                nextSlide,
                slideInterval
            );

        }

    }


    // Start slideshow

    startSlideshow();


    // Contact popup elements

    const contactButton = document.getElementById("contactButton");
    const contactClose = document.getElementById("contactClose");
    const contactPopup = document.getElementById("contactPopup");
    const contactBackdrop = document.querySelector(".contact-backdrop");
    const siteMain = document.querySelector("main");
    const slideshowControls = document.querySelector(".slideshow-controls");

    let previousFocus = null;


    // Open contact popup

    function openContact() {

        if (document.body.classList.contains("contact-open")) {
            return;
        }

        previousFocus = document.activeElement;

        contactPopup.inert = false;
        contactPopup.setAttribute("aria-hidden", "false");

        document.body.classList.add("contact-open");
        contactButton.setAttribute("aria-expanded", "true");

        siteMain.inert = true;
        slideshowControls.inert = true;

        contactClose.focus();

    }


    // Close contact popup

    function closeContact() {

        if (!document.body.classList.contains("contact-open")) {
            return;
        }

        document.body.classList.remove("contact-open");

        siteMain.inert = false;
        slideshowControls.inert = false;

        contactButton.setAttribute("aria-expanded", "false");

        contactPopup.inert = true;
        contactPopup.setAttribute("aria-hidden", "true");

        if (previousFocus && previousFocus.isConnected) {
            previousFocus.focus();
        }

    }


    // Open popup on button click

    contactButton.addEventListener("click", openContact);


    // Close popup on close button click

    contactClose.addEventListener("click", closeContact);


    // Close popup when clicking outside

    contactBackdrop.addEventListener("click", closeContact);


    // Keyboard accessibility

    document.addEventListener("keydown", (event) => {

        if (!document.body.classList.contains("contact-open")) {
            return;
        }

        // Escape closes popup

        if (event.key === "Escape") {

            closeContact();
            return;

        }

        // Keep keyboard focus inside popup

        if (event.key === "Tab") {

            const focusableElements = [
                ...contactPopup.querySelectorAll(
                    "button:not([disabled]), a[href]"
                )
            ];

            const first = focusableElements[0];
            const last = focusableElements[focusableElements.length - 1];

            if (!first || !last) {

                event.preventDefault();
                contactPopup.focus();
                return;

            }

            if (
                event.shiftKey &&
                document.activeElement === first
            ) {

                event.preventDefault();
                last.focus();

            } else if (
                !event.shiftKey &&
                document.activeElement === last
            ) {

                event.preventDefault();
                first.focus();

            }

        }

    });

</script>

</body>
</html>
